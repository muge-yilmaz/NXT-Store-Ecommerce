name: CI Pipeline (Unit Tests & Linting)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ecom-nextjs-project

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './ecom-nextjs-project/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test"
        run: npx prisma generate

      - name: Run Linter
        run: npm run lint
        continue-on-error: true

      - name: Run Unit Tests
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test"
          AUTH0_SECRET: "32_byte_dummy_secret_for_auth0_testing_123"
          AUTH0_BASE_URL: "http://localhost:3000"
          AUTH0_ISSUER_BASE_URL: "https://test.auth0.com"
          AUTH0_CLIENT_ID: "dummy_client_id"
          AUTH0_CLIENT_SECRET: "dummy_client_secret"
        run: npx jest src/__tests__ --passWithNoTests